name: Build & Push Docker Images

on:
  push:
    branches: [main]
    paths:
      - 'azure-voice-admin/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  CADDY_IMAGE: ghcr.io/yingcaihuang/azure-voice-admin-caddy
  BACKEND_IMAGE: ghcr.io/yingcaihuang/azure-voice-admin-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tags
        id: tags
        run: |
          SHA_SHORT=$(echo "${{ github.sha }}" | cut -c1-7)
          DATE_TAG=$(date +%Y%m%d)
          echo "sha_short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "date_tag=${DATE_TAG}" >> $GITHUB_OUTPUT

      - name: Build & Push Caddy (Frontend)
        uses: docker/build-push-action@v6
        with:
          context: ./azure-voice-admin
          file: ./azure-voice-admin/Dockerfile.caddy
          push: true
          tags: |
            ${{ env.CADDY_IMAGE }}:latest
            ${{ env.CADDY_IMAGE }}:${{ steps.tags.outputs.sha_short }}
            ${{ env.CADDY_IMAGE }}:${{ steps.tags.outputs.date_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/yingcaihuang/qwen_livekit_demo
            org.opencontainers.image.description=Azure Voice Admin - Caddy + Frontend
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./azure-voice-admin/backend
          file: ./azure-voice-admin/backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.sha_short }}
            ${{ env.BACKEND_IMAGE }}:${{ steps.tags.outputs.date_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/yingcaihuang/qwen_livekit_demo
            org.opencontainers.image.description=Azure Voice Admin - Python Backend
          cache-from: type=gha
          cache-to: type=gha,mode=max
