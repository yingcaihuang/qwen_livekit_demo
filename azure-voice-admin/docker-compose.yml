services:
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - SITE_DOMAIN=${SITE_DOMAIN:-:80}
      - RTC_DOMAIN=${RTC_DOMAIN:-}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_started
      livekit:
        condition: service_started

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    expose:
      - "8090"
    env_file:
      - .env.production
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_PUBLIC_URL=${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}
      - DB_PATH=/app/data/voice_admin.db
      - PORT=8090
      - AUTH_SECRET_KEY=6_0Edc3WKFaGWyYPO18HsbUGv-I22PqXwa7vB6Hp80M=
    volumes:
      - ./data:/app/data
    depends_on:
      - livekit

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/livekit-entrypoint.sh"]
    environment:
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-APIKeyForVoiceAdmin}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-ThisIsASecretThatIsAtLeast32CharsLong!}
      - LIVEKIT_NODE_IP=${LIVEKIT_NODE_IP:-}
    volumes:
      - ./livekit-entrypoint.sh:/etc/livekit-entrypoint.sh:ro
    ports:
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    expose:
      - "7880"

volumes:
  caddy_data:
  caddy_config:
