[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"

[tool.commitizen.customize]
# Allowed commit types
schema_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\(.+\\))?!?: .+"
schema = "<type>(<scope>): <description>"
info = """
Commit message 必须遵循 Conventional Commits 规范：

  <type>(<scope>): <description>

允许的 type：
  feat     - 新功能
  fix      - Bug 修复
  docs     - 文档变更
  style    - 代码格式（不影响逻辑）
  refactor - 代码重构
  perf     - 性能优化
  test     - 测试相关
  build    - 构建系统或外部依赖
  ci       - CI/CD 配置
  chore    - 其他杂项
  revert   - 回滚提交

示例：
  feat(voice): 添加音色选择功能
  fix(session): 修复 token 统计为零的问题
  docs: 更新 README
  chore(docker): 优化构建配置
"""
